project:
  type: website
  output-dir: docs
  resources:
    - Assets/
    - Scripts/
  render: 
    - index.qmd
    - pages/country-index.qmd
    - pages/centralamericamexico.qmd
    - pages/caribbean.qmd
    - pages/southamerica.qmd
    - pages/europemiddleeastnorthafrica.qmd
    - pages/sub-saharanafrica.qmd
    - pages/southasia.qmd
    - pages/eastsoutheastasia.qmd
    - pages/pacificislands.qmd
    - pages/methods.qmd
    - pages/about.qmd
    - pages/faq.qmd
    - pages/data.qmd
 
  
website:
  site-url: https://globaldengueobservatory.org/
  favicon: Assets/Stable/logo.png
  image: Assets/Stable/logo_large.png
  open-graph: true
  navbar:
    logo: Assets/Stable/logo.png
    title: "Global Dengue Observatory"
    right:
      - text: "Home"
        href: index.qmd
      - text: "All Countries"
        href: pages/country-index.qmd
      - text: "Regions"
        menu: 
          - text: "North & Central America"         
            href: pages/centralamericamexico.qmd
          - text: "Caribbean"                       
            href: pages/caribbean.qmd
          - text: "South America"
            href: pages/southamerica.qmd
          - text: "Europe, Middle East & North Africa" 
            href: pages/europemiddleeastnorthafrica.qmd
          - text: "Sub-Saharan Africa"    
            href: pages/sub-saharanafrica.qmd
          - text: "South Asia"
            href: pages/southasia.qmd
          - text:  "East & Southeast Asia"
            href: pages/eastsoutheastasia.qmd
          - text: "Pacific Islands"  
            href: pages/pacificislands.qmd
      - text: "Methods"
        href: pages/methods.qmd
      - text: "Data"
        href: pages/data.qmd
      - text: "About"
        href: pages/about.qmd
      - text: "FAQ"
        href: pages/faq.qmd
      - icon: github
        href: https://github.com/DengueGlobalObservatory/DENV_global_observatory
  page-footer:
    center: "© 2025 LSHTM Global Dengue Observatory"

format:
  html:
    theme: minty
    css: style.css
    include-after-body:
      - scrollama.js
    toc: false
    toc-depth: 3
    page-layout: full


filters:
  - quarto

    
    
                   
          
           
