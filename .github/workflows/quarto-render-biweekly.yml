# Renders the Quarto website into docs/ on the 4th and 18th of each month at 18:00 UTC.
# Runs after the daily V1 pipeline (10:00 UTC) so Output/ is fresh before render.
name: Quarto render biweekly

on:
  schedule:
    - cron: "0 18 4,18 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-render-biweekly
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries for terra, units, and magick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libudunits2-dev \
            libmagick++-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install render-only R packages
        run: |
          Rscript -e 'renv::install(c("DT", "cropcircles", "magick", "geomtextpath"))'

      - name: Regenerate country page wrappers
        run: Rscript Scripts/country/generate_country_pages.R

      - name: Render Quarto website
        run: quarto render

      # Pushes require the default branch to allow GitHub Actions (or use a PAT in secrets and pass it to checkout).
      - name: Commit and push rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ pages/country/
          if git diff --staged --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "chore: Quarto site render $(date -u +%Y-%m-%d)"
            git push
          fi
